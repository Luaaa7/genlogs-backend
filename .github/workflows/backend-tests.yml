name: Pruebas backend
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Ejecutar pruebas (base H2 en memoria, no toca produccion)
        run: mvn -B test
      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports
