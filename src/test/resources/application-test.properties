# Configuración para los tests de integración (perfil "test").
#
# Importante: va como application-TEST.properties y no como application.yml
# porque, dentro de la misma ubicación de classpath, Spring Boot da prioridad
# a los .properties sobre los .yml. Con el application.yml los tests seguían
# leyendo el application.properties de main (${DATABASE_URL}) y el contexto
# no arrancaba.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# schema.sql (vista vw_cotizacion_totales) se ejecuta DESPUÉS de que
# Hibernate cree el esquema, si no la vista no encuentra las tablas.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=test-secret-key-which-is-at-least-32-chars-long
jwt.expiration=3600000

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
