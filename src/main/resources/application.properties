
# 1. CONEXIÓN A LA BASE DE DATOS (SUPABASE)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.wyewdagpmbaqgqpdpkab}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración obligatoria para el Pooler de Supabase
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# 2. CONFIGURACIÓN DE HIBERNATE / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. SERVIDOR Y JWT
# Render asigna su propio puerto en la variable de entorno PORT; en local usa 8080 por defecto
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# 4. Configuración de Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}