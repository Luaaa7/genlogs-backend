# JWT
jwt.secret=${JWT_SECRET}
# El token JWT que se genere va a durar 24 horas antes de expirar
jwt.expiration=86400000

# CORS: origenes permitidos separados por coma (en Render: variable CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://genlogs-frontend-kym5.onrender.com,http://localhost:5173,http://127.0.0.1:5173}

# URL publica del frontend (se usa para armar el enlace del correo de recuperacion)
app.frontend-url=${FRONTEND_URL:https://genlogs-frontend-kym5.onrender.com}

# Correo (Resend por HTTPS). Si RESEND_API_KEY esta vacia, el enlace se imprime en los logs.
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:GenLogs <onboarding@resend.dev>}

# Conexión a PostgreSQL (Supabase - pooler, modo transacción)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR